<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14100c" />
    <meta name="description" content="Ethurel — RPG narrativo cinematográfico com regras determinísticas e narração adaptativa." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:," />
    <title>Ethurel</title>
    <style>
      /* Paleta Fase 3 (Vertical Slice Visual §"Direção Visual"): medieval
         rústica/material — pedra, madeira, couro, metal envelhecido, luz de
         fogo. Substitui a paleta anterior violeta/índigo dominante (spec
         explícita: "EVITAR: roxo/violeta dominante"). Nomes de variável
         mantidos por compatibilidade (nada no código referencia
         --violet/--indigo por var(), só os hex aqui e em theme.css/
         componentes — todos atualizados junto). */
      :root {
        color-scheme: dark;
        --bg-void: #14100c;
        --bg-deep: #1c1712;
        --violet-deep: #2e2721;
        --violet: #4a3a28;
        --indigo: #3a2c1e;
        --accent: #c9973f;
        --accent-soft: #e3bd7d;
        --silver: #d9d0bd;
        --text: #ede4d3;
        --text-dim: #ad9d86;
        --danger: #b8493f;
        --gold: #d8b872;
        --font-display: 'Cinzel', Georgia, serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-void);
        color: var(--text);
        overflow: hidden;
        overscroll-behavior: none;
        font-family: 'Georgia', 'Iowan Old Style', serif;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
