name: Deploy preview to GitHub Pages

# Publica o build da Fase 2 (protótipo de movimento) numa URL HTTPS acessível
# direto no Android, sem depender de um computador do usuário rodando `npm run
# dev` — critério obrigatório de saída da Fase 2
# (docs/design/04-VERTICAL-SLICE-E-ROADMAP.md §3). Usa GitHub Pages, gratuito e
# dentro do próprio repositório — nenhum serviço externo pago, nenhuma
# credencial nova.

on:
  push:
    branches:
      - claude/ethurel-reconstrucao-uz59be
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
